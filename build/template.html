    + '<br><b>名单口径：</b>明细与左侧个股筛选<b>同一套条件</b>，'
    + (ctx.follow ? '当前已联动（' + (filtered ? '命中 ' + n + ' / 本批 ' + totN + ' 只' : '未加筛选，共 ' + n + ' 只') + '）'
                  : '当前未联动，显示整批 ' + totN + ' 只') + '；点右上「跟随筛选」可切换。';
  let extra = '';
  if (!days) {
    extra = '<br><b>今日批次刚建立（T+0），尚无后续行情。</b>'
      + (filtered ? '当前筛选的 ' + n + ' 只（本批共 ' + totN + ' 只）' : '全部 ' + n + ' 只')
      + '已按当日收盘价记录成本，下个交易日更新后开始填充。';
  } else if (multi) {
    extra = '<br><b>当前：</b>' + co.length + ' 个批次合并展示，每行的十格对应该批次自己的 T+1 ~ T+'
      + MAXD + '，红绿深浅是<b>当日涨跌幅</b>；点批次按钮可只看单批。';
  } else {
    extra = '<br><b>当前：</b>' + co[0].date + ' 批次已跟踪 ' + days + ' 个交易日，'
      + (co[0].done ? '窗口已满，台账封存' : '还剩 ' + (MAXD - days) + ' 个交易日')
      + '；十格依次对应 T+1 ~ T+' + MAXD + '，金色描边为最新一天，悬停可看当日与累计。';
  }
  $('#tkNote').innerHTML = rule + extra;

  NAV = {series: ctx.series, nav: nav, MAXD: MAXD, cal: ctx.cal, baseDate: ctx.baseDate,
         days: days};
}

let NAV = null;

function drawNav(cv) {
  const {ctx, w, h} = prep(cv);
  const S = (NAV && NAV.series) || [];
  const MAXD = (NAV && NAV.MAXD) || 10;
  const cal = (NAV && NAV.cal) || [];
  const padL = 46, padR = 54, padT = 15, padB = 36;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const X = i => padL + (i / MAXD) * plotW;

  let lo = 0, hi = 0;
  S.forEach(q => { lo = Math.min(lo, q.nav, q.idx); hi = Math.max(hi, q.nav, q.idx); });
  if (S.length < 2) { lo = -2; hi = 2; }
  const pad = Math.max(1, (hi - lo) * 0.16);
  lo -= pad; hi += pad;
  const raw = (hi - lo) / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const nrm = raw / mag;
  const stepY = (nrm <= 1 ? 1 : nrm <= 2 ? 2 : nrm <= 2.5 ? 2.5 : nrm <= 5 ? 5 : 10) * mag;
  lo = Math.floor(lo / stepY) * stepY;
  hi = Math.ceil(hi / stepY) * stepY;
  const Y = v => padT + (hi - v) / (hi - lo) * plotH;

  const mu = cssVar('--muted'), bd = cssVar('--border'), dim = cssVar('--dim');
  const reached = Math.max(0, S.length - 1);

  if (reached > 0 && reached < MAXD) {
    ctx.fillStyle = 'rgba(128,140,160,.055)';
    ctx.fillRect(X(reached), padT, X(MAXD) - X(reached), plotH);
  }

  for (let v = lo; v <= hi + 1e-9; v += stepY) {
    const y = Y(v);
    ctx.strokeStyle = Math.abs(v) < 1e-9 ? bd : 'rgba(128,140,160,.16)';
    dash(ctx, Math.abs(v) < 1e-9);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
    dash(ctx, false);
    text(ctx, (v > 0 ? '+' : '') + v.toFixed(1) + '%', padL - 8, y, mu, 'right', 9.5);
  }

  for (let i = 0; i <= MAXD; i++) {
    const x = X(i);
    ctx.strokeStyle = 'rgba(128,140,160,.09)';
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
    const al = i === 0 ? 'left' : (i === MAXD ? 'right' : 'center');
    const over = i > reached;
    text(ctx, 'T+' + i, x, h - padB + 13, over ? dim : mu, al, 9.5);
    const dt = i === 0 ? ((NAV && NAV.baseDate) || '') : (cal[i - 1] || '');
    if (dt) text(ctx, dt.slice(5), x, h - padB + 25, dim, al, 8.5);
  }

  if (S.length < 2) {
    text(ctx, 'T+0 · ' + ((NAV && NAV.baseDate) || '--'), w / 2, h / 2 - 12,
      cssVar('--muted'), 'center', 13);
    text(ctx, '窗口 T+1 ~ T+' + MAXD + ' 待更新，下个交易日收盘后即可开始填充',
      w / 2, h / 2 + 12, dim, 'center', 11);
    return;
  }

  const line = (key, col, wdt) => {
    ctx.beginPath();
    S.forEach((q, i) => i ? ctx.lineTo(X(i), Y(q[key])) : ctx.moveTo(X(i), Y(q[key])));
    ctx.strokeStyle = col; ctx.lineWidth = wdt; ctx.stroke();
  };
  line('idx', dim, 1.2);
  const navNow = (NAV && NAV.nav) || 0;
  line('nav', navNow >= 0 ? cssVar('--up') : cssVar('--down'), 1.8);

  const p0 = S[S.length - 1];
  ctx.beginPath(); ctx.arc(X(reached), Y(p0.nav), 2.8, 0, 7);
  ctx.fillStyle = navNow >= 0 ? cssVar('--up') : cssVar('--down'); ctx.fill();

  if (reached < MAXD) {
    const tw = X(MAXD) - X(reached);
    if (tw > 76) {
      text(ctx, '剩余 ' + (MAXD - reached) + ' 日', (X(reached) + X(MAXD)) / 2,
        padT + plotH / 2, dim, 'center', 10.5);
    }
  }
}

if (document.querySelector('#trendDate')) {
  document.querySelector('#trendDate').textContent = META.date || '';
}

function redrawAll() {
  renderList();
  const d = ACTIVE[state.sel]; if (!d) return;
  renderHead(d); drawTrend($('#cvTrend'), d); drawKline($('#cvK'), d);
}

let rz;
const ro = new ResizeObserver(() => {
  if (rz) cancelAnimationFrame(rz);
  rz = requestAnimationFrame(() => {
    const d = ACTIVE[state.sel]; if (!d) return;
    drawTrend($('#cvTrend'), d); drawKline($('#cvK'), d);
  });
});
ro.observe($('#cvTrend').parentElement);
ro.observe($('#cvK').parentElement);
ro.observe($('#cvNav').parentElement);

/* ---------------- 访问口令 ---------------- */
/* 纯 JS SHA-256：Pages(https) 与本地双击(file://) 都能校验。
   这里不能用 WebCrypto —— 非安全上下文下 crypto.subtle 是 undefined。 */
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
           0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
           0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
           0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
           0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
           0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
           0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
           0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  const m=new TextEncoder().encode(str), len=m.length, bits=len*8;
  const buf=new Uint8Array((((len+9)+63)>>6)<<6);
  buf.set(m); buf[len]=0x80;
  buf[buf.length-4]=(bits>>>24)&255; buf[buf.length-3]=(bits>>>16)&255;
  buf[buf.length-2]=(bits>>>8)&255;  buf[buf.length-1]=bits&255;
  const w=new Uint32Array(64);
  for(let i=0;i<buf.length;i+=64){
    for(let j=0;j<16;j++){
      const o=i+j*4;
      w[j]=((buf[o]<<24)|(buf[o+1]<<16)|(buf[o+2]<<8)|buf[o+3])>>>0;
    }
    for(let j=16;j<64;j++){
      const a=w[j-15], b=w[j-2];
      const s0=(rr(a,7)^rr(a,18)^(a>>>3))>>>0;
      const s1=(rr(b,17)^rr(b,19)^(b>>>10))>>>0;
      w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let j=0;j<64;j++){
      const S1=(rr(e,6)^rr(e,11)^rr(e,25))>>>0;
      const ch=((e&f)^(~e&g))>>>0;
      const t1=(h+S1+ch+K[j]+w[j])>>>0;
      const S0=(rr(a,2)^rr(a,13)^rr(a,22))>>>0;
      const mj=((a&b)^(a&c)^(b&c))>>>0;
      const t2=(S0+mj)>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0;
      d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

/* 改口令只要改这一行：把新口令的 SHA-256 填进 GATE_HASH
   生成命令： python3 -c "import hashlib;print(hashlib.sha256('你的新口令'.encode()).hexdigest())" */
const GATE_HASH = '8def2d28978646d47669454ebfbe53b19003354997d1d5f79804388ffe7c2fec';
const GATE_KEY  = 'wb-gate-v1';
const GATE_DAYS = 30;

function gatePassed(){
  try{
    const o = JSON.parse(localStorage.getItem(GATE_KEY) || 'null');
    return !!(o && o.h === GATE_HASH && o.t > Date.now());
  }catch(e){ return false; }
}

/* ---------------- boot ---------------- */
function init() {
  enrichAmt();
  initDates();
  const _tf = $('#tkFollow'); if (_tf) _tf.classList.toggle('on', !!state.followFilter);
  buildKpis();
  buildTierLabels();
  updateAmtHint();
  state.sel = -1;
  renderList();
  const first = state.view.length ? state.view[0] : 0;
  select(first, true);
  renderTrack();
  syncFavUI();

  // 题材雷达角标：主推数量
  const thN = ((THEME || {}).themes || []).filter(x => x.tier === 'main').length;
  const thB = $('#thBadge');
  if (thB && thN) { thB.textContent = thN; thB.style.display = ''; }

  // URL 支持：?d=2026-11-05 定位交易日，?code=600281 或 #600281 定位个股
  const qc = (location.search.match(/[?&]code=(\d{6})/) || [])[1]
          || (location.hash || '').replace(/[^0-9]/g, '');
  const qd = (location.search.match(/[?&]d=([0-9-]{8,10})/) || [])[1];
  if (qd && qd !== state.date) setDay(qd);          // setDay 会改写 URL，故先取 qc
  if (qc) focusCode(qc);
}

/* 口令门：通过后才初始化，未通过时工作台不渲染 */
(function boot(){
  try {
    const t = localStorage.getItem('wb-theme');
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}

  const gate  = document.getElementById('gate');
  const card  = document.getElementById('gateCard');
  const input = document.getElementById('gateInput');
  const msg   = document.getElementById('gateMsg');
  const enter = () => { gate.classList.add('hide'); init(); };

  if (gatePassed()) return enter();

  setTimeout(() => { try { input.focus(); } catch (e) {} }, 80);   // 先让首帧画出来再聚焦
  const fail = t => {
    msg.textContent = t;
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    try { input.select(); } catch (e) {}
  };
  card.addEventListener('submit', e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return fail('请输入口令');
    if (sha256(v) !== GATE_HASH) return fail('口令不对，请重试');
    try { localStorage.setItem(GATE_KEY, JSON.stringify({h: GATE_HASH, t: Date.now() + GATE_DAYS * 864e5})); } catch (e) {}
    msg.style.color = 'var(--down)'; msg.textContent = '口令正确，正在载入…';
    setTimeout(enter, 160);
  });
})();
</script>
