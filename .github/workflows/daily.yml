name: 每日自动更新

on:
  schedule:
    # GitHub 定时器按 UTC 计
    - cron: '40 7 * * 1-5'    # 15:40 北京时间，收盘后出首版
    # 20:10 而非 19:40：央视新闻联播的当日归档页要 20:00 前后才挂出来，
    # 19:45 那次实测抓到的是前一天的联播，等于催化白跑一轮
    - cron: '10 12 * * 1-5'   # 20:10 北京时间，等联播归档出来后再补催化
  # 支持在 Actions 页面手动点运行（补跑、验证用）
  workflow_dispatch:

permissions:
  contents: write      # 回写每日数据
  pages: write         # 发布 Pages
  id-token: write      # Pages 部署需要

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 麦蕊智数证书：K线与分时主源（东财 /api/qt/clist 已被风控整段封禁）
      MAIRUI_LICENCE: ${{ secrets.MAIRUI_LICENCE }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 19:40 那次只补催化与题材：行情在收盘时已经定版，没必要重抓全市场
      - name: 1/8 全市场筛选（抓东财行情）
        if: github.event.schedule != '40 11 * * 1-5'
        run: python3 build/screen.py

      # 催化源清洗：新闻联播 + 韭研公社。缺 JY_API_KEY 时自动跳过韭研，不阻断流程
      - name: 2/8 催化源清洗（新闻联播 + 韭研公社）
        continue-on-error: true
        env:
          JY_API_KEY: ${{ secrets.JY_API_KEY }}
        run: python3 build/catalyst.py

      # 题材雷达是独立模块：即使资讯接口在海外受限，也不能拖垮当天的选股与部署
      - name: 3/8 题材雷达（低位轮动新题材 + 资讯热度 + 财务排雷）
        continue-on-error: true
        run: python3 build/theme_scan.py

      # 低位异动依赖催化源（韭研点名、新闻联播、政策池），所以排在上一步之后；
      # 它自己抓涨幅榜与 K 线，19:40 那次不重跑行情也能独立出结果
      - name: 4/8 低位异动（低位放量 + 消息归因 + 持续性）
        continue-on-error: true
        run: python3 build/anomaly.py

      # 异动名单的 T+1~T+5 台账：只请求名单里的票，几十个 K 线请求，19:40 补跑也不心疼
      - name: 5/8 异动收益跟踪 T+1~T+5
        continue-on-error: true
        run: python3 build/anom_track.py

      - name: 6/8 收益跟踪 T+1~T+10
        if: github.event.schedule != '40 11 * * 1-5'
        run: python3 build/track.py

      - name: 7/8 导出 CSV
        if: github.event.schedule != '40 11 * * 1-5'
        continue-on-error: true
        run: python3 build/gen_csv.py

      - name: 8/8 生成工作台页面
        run: python3 build/build.py

      - name: 提交每日数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A build/full build/snap build/theme build/catalyst build/anomaly build/boards.json build/boardhist.json build/anomtrack.json build/track.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          # 运行期间若有人往 main 推了东西（改 workflow、手补数据），直接 push 会 non-fast-forward 失败，
          # 连带把后面的「整理发布目录 + 部署」整段跳过——今天就这样白跑一轮。这里改成先 rebase 再推，失败重试。
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "推送成功"; break
            fi
            echo "第 $i 次推送失败，3 秒后重试"
            sleep 3
          done

      - name: 整理发布目录
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d history ]; then cp -r history _site/history; fi
          echo "发布内容："
          du -sh _site
          ls -1 _site

      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
