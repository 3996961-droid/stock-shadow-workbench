name: 每日自动更新

on:
  schedule:
    # GitHub 定时器按 UTC 计。07:40 UTC = 北京时间 15:40，收盘后
    - cron: '40 7 * * 1-5'
  # 支持在 Actions 页面手动点运行（补跑、验证用）
  workflow_dispatch:

permissions:
  contents: write      # 回写每日数据
  pages: write         # 发布 Pages
  id-token: write      # Pages 部署需要

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1/5 全市场筛选（抓东财行情）
        run: python3 build/screen.py

      # 题材雷达是独立模块：即使资讯接口在海外受限，也不能拖垮当天的选股与部署
      - name: 2/5 题材雷达（低位新题材 + 资讯热度 + 财务排雷）
        continue-on-error: true
        run: python3 build/theme_scan.py

      - name: 3/5 收益跟踪 T+1~T+10
        run: python3 build/track.py

      - name: 4/5 导出 CSV
        continue-on-error: true
        run: python3 build/gen_csv.py

      - name: 5/5 生成工作台页面
        run: python3 build/build.py

      - name: 提交每日数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A build/full build/snap build/theme build/track.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 整理发布目录
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d history ]; then cp -r history _site/history; fi
          echo "发布内容："
          du -sh _site
          ls -1 _site

      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
